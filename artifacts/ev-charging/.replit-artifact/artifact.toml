kind = "mobile"
previewPath = "/"
title = "EV Charging App"
version = "1.0.0"
id = "artifacts/ev-charging"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 22766

[services.development]
run = "pnpm --filter @workspace/ev-charging run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ev-charging", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/ev-charging", "run", "serve" ]

[services.env]
PORT = "22766"
BASE_PATH = "/"
